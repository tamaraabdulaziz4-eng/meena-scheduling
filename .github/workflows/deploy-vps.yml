name: Deploy to VPS

on:
  push:
    branches: [claude/crawl4ai-install-o0j8wf]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASS }}
          port: 22
          script_stop: true
          script: |
            set -e

            # --- System deps ---
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git python3 python3-pip python3-venv nodejs npm redis-server nginx curl

            # --- Clone / pull repo ---
            REPO_DIR="/opt/ai-company"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin
              git checkout claude/crawl4ai-install-o0j8wf
              git pull origin claude/crawl4ai-install-o0j8wf
            else
              git clone -b claude/crawl4ai-install-o0j8wf https://github.com/${{ github.repository }}.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            # --- Python venv ---
            python3 -m venv /opt/ai-venv
            /opt/ai-venv/bin/pip install -q --upgrade pip
            /opt/ai-venv/bin/pip install -q -r requirements.txt || true
            /opt/ai-venv/bin/pip install -q \
              fastapi uvicorn apscheduler anthropic httpx sqlite-utils

            # --- Write env file ---
            cat > /opt/ai-company/ai-company/.env << 'ENVEOF'
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ENVEOF

            # --- Build Next.js ---
            cd /opt/ai-company/resume-ai
            npm ci --quiet
            cat > .env.local << 'NEXTENV'
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            NEXT_PUBLIC_PAYLINK_SINGLE=${{ secrets.PAYLINK_SINGLE }}
            NEXT_PUBLIC_PAYLINK_MONTHLY=${{ secrets.PAYLINK_MONTHLY }}
            NEXTENV
            npm run build

            # --- systemd: agents ---
            cat > /etc/systemd/system/resumeai-agents.service << 'SVC'
            [Unit]
            Description=ResumeAI Agents
            After=network.target redis.service

            [Service]
            WorkingDirectory=/opt/ai-company/ai-company
            ExecStart=/opt/ai-venv/bin/python3 run_company.py --daemon
            Restart=always
            RestartSec=10
            EnvironmentFile=/opt/ai-company/ai-company/.env

            [Install]
            WantedBy=multi-user.target
            SVC

            # --- systemd: dashboard ---
            cat > /etc/systemd/system/resumeai-dashboard.service << 'SVC'
            [Unit]
            Description=ResumeAI Dashboard
            After=network.target

            [Service]
            WorkingDirectory=/opt/ai-company/ai-company
            ExecStart=/opt/ai-venv/bin/python3 run_company.py --dashboard
            Restart=always
            RestartSec=5
            EnvironmentFile=/opt/ai-company/ai-company/.env

            [Install]
            WantedBy=multi-user.target
            SVC

            # --- systemd: Next.js ---
            cat > /etc/systemd/system/resumeai-web.service << 'SVC'
            [Unit]
            Description=ResumeAI Next.js Web
            After=network.target

            [Service]
            WorkingDirectory=/opt/ai-company/resume-ai
            ExecStart=/usr/bin/npm start -- -p 3000
            Restart=always
            RestartSec=5
            EnvironmentFile=/opt/ai-company/resume-ai/.env.local

            [Install]
            WantedBy=multi-user.target
            SVC

            # --- nginx config ---
            cat > /etc/nginx/sites-available/resumeai << 'NGX'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://localhost:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }

                location /dashboard/ {
                    proxy_pass http://localhost:8080/;
                    proxy_set_header Host $host;
                }
            }
            NGX

            ln -sf /etc/nginx/sites-available/resumeai /etc/nginx/sites-enabled/resumeai
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx

            # --- Enable and start services ---
            systemctl daemon-reload
            systemctl enable redis-server resumeai-agents resumeai-dashboard resumeai-web
            systemctl restart redis-server
            systemctl restart resumeai-dashboard
            systemctl restart resumeai-web
            systemctl restart resumeai-agents

            echo "=== DEPLOYMENT COMPLETE ==="
            echo "Web:       http://156.244.12.174/"
            echo "Dashboard: http://156.244.12.174/dashboard/"
