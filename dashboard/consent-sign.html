<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4D3C82">
<title>إقرار عدم الحمل · Non-Pregnancy Consent</title>
<style>
  :root{ --pri:#6B4EFF; --acc:#8358FD; --ink:#1a1730; --mut:#6b6785; --line:#e7e3f5; --bg:#f5f3fb; --card:#fff; }
  @media (prefers-color-scheme:dark){ :root{ --ink:#e9e7f5; --mut:#9b98c0; --line:#262340; --card:#17152b; --bg:#0d0b1a; } }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.7; padding:0 0 40px; }
  .wrap{ max-width:560px; margin:0 auto; }
  header{ background:linear-gradient(135deg,var(--pri),var(--acc)); color:#fff; padding:20px 18px; text-align:center; }
  header .t{ font-size:20px; font-weight:800; }
  header .s{ font-size:12.5px; opacity:.92; margin-top:3px; direction:ltr; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; margin:14px; padding:16px; }
  .sum{ display:grid; grid-template-columns:auto 1fr; gap:8px 14px; }
  .sum .k{ color:var(--mut); font-size:12.5px; font-weight:700; white-space:nowrap; }
  .sum .v{ font-weight:700; font-size:14px; word-break:break-word; }
  .sum .v.ltr{ direction:ltr; text-align:right; }
  h2{ font-size:15px; font-weight:800; margin:2px 0 10px; }
  .bi{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .bi .en{ direction:ltr; color:var(--mut); font-size:12px; font-weight:500; }
  .decl{ background:#f2efff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-weight:700; font-size:15px; }
  .decl .en{ display:block; direction:ltr; color:var(--mut); font-weight:500; font-size:12.5px; margin-top:3px; }
  label.opt{ display:flex; align-items:center; gap:10px; padding:11px 12px; border:1.5px solid var(--line);
    border-radius:12px; margin-top:9px; font-size:14.5px; font-weight:600; cursor:pointer; }
  label.opt.sel{ border-color:var(--pri); background:#f2efff; }
  label.opt input{ width:20px; height:20px; accent-color:var(--pri); flex:0 0 auto; }
  label.opt .en{ direction:ltr; color:var(--mut); font-size:12px; font-weight:500; margin-inline-start:auto; }
  .lmp{ margin-top:9px; display:none; }
  .lmp.show{ display:block; }
  .lmp input, .field input{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px;
    font-size:15px; font-family:inherit; background:#fff; }
  .field{ margin-top:10px; }
  .field .lab{ font-size:12.5px; font-weight:700; color:var(--mut); margin-bottom:5px; }
  .vitals{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .risk{ background:#fff6e6; border:1px solid #f0d69a; border-radius:12px; padding:12px 14px; font-size:13px;
    color:#7a5600; font-weight:600; }
  .risk .en{ display:block; direction:ltr; margin-top:4px; font-weight:500; }
  .sigbox{ position:relative; border:2px dashed var(--line); border-radius:14px; background:#fff; height:210px; margin-top:8px; }
  canvas#sig{ width:100%; height:100%; display:block; touch-action:none; border-radius:12px; }
  .sigclear{ position:absolute; top:8px; inset-inline-start:8px; font-size:12px; padding:5px 11px; border:1px solid var(--line);
    background:var(--bg); border-radius:9px; font-weight:700; }
  .hint{ font-size:12px; color:var(--mut); margin-top:6px; text-align:center; }
  .btn{ width:100%; padding:15px; border:none; border-radius:14px; background:var(--pri); color:#fff; font-size:16px;
    font-weight:800; font-family:inherit; margin-top:6px; }
  .btn:disabled{ opacity:.6; }
  .msg{ text-align:center; margin:12px 14px; font-size:14px; font-weight:700; min-height:20px; }
  .ok{ color:#0a7c42; } .err{ color:#c0392b; }
  .done{ text-align:center; padding:50px 20px; }
  .done .big{ font-size:56px; } .done .t{ font-size:20px; font-weight:800; margin-top:8px; }
  .done .s{ color:var(--mut); margin-top:6px; direction:ltr; }
  .foot{ text-align:center; color:var(--mut); font-size:11px; margin-top:16px; direction:ltr; }
  .formlbl{ font-size:13px; font-weight:800; color:var(--pri); margin-bottom:8px; }
  .formimg{ width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">نموذج إقرار بعدم وجود حمل</div>
    <div class="s">Declaration of Non-Pregnancy · Radiology</div>
  </header>
  <div id="app"><div class="card" id="loading">جارٍ التحميل… · Loading…</div></div>
  <div class="foot">Meena Health · Radiology Department</div>
</div>

<script>
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var HAS_INK = false, DRAWING = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function show(html){ document.getElementById('app').innerHTML = html; }

function load(){
  if(!TOKEN){ show('<div class="card err" style="text-align:center">الرابط غير صحيح · Invalid link</div>'); return; }
  fetch('/api/public/consent/'+encodeURIComponent(TOKEN)).then(function(r){
    if(!r.ok) return r.json().then(function(d){ throw new Error((d&&d.detail)||('HTTP '+r.status)); });
    return r.json();
  }).then(function(d){
    if(d.signed){ return doneView(); }
    render(d);
  }).catch(function(e){
    show('<div class="card err" style="text-align:center">'+esc(e.message||'تعذّر فتح النموذج')+'</div>');
  });
}

function render(d){
  show(
    // The REAL Meena form, pre-filled with her data — she reads the actual document.
    '<div class="card"><div class="formlbl">اقرئي النموذج · Read the form</div>'
    + '<img class="formimg" src="/api/public/consent/'+encodeURIComponent(TOKEN)+'/form.png?ts='+Date.now()+'" alt="نموذج الإقرار"'
    + ' onerror="this.style.display=\'none\';var w=document.getElementById(\'formerr\');if(w)w.style.display=\'block\';">'
    + '<div id="formerr" class="msg err" style="display:none">تعذّر تحميل صورة النموذج · Could not load the form image. الرجاء إبلاغ الأخصائي.</div></div>'

    + '<div class="card">'
    + '<h2>اختاري السبب · <span style="font-weight:500;color:var(--mut)">Select the reason</span></h2>'
    + opt('not_married','لست متزوجة','Not married')
    + opt('lmp','تاريخ آخر دورة شهرية','Last menstrual period')
    + '<div class="lmp" id="lmpwrap"><input type="date" id="lmp"></div>'
    + opt('iud','مانع الحمل اللولب','IUD')
    + '</div>'

    + '<div class="card"><h2>التوقيع · <span style="font-weight:500;color:var(--mut)">Signature</span></h2>'
    + '<div class="decl" style="margin-bottom:12px;font-size:13.5px">بالتوقيع أدناه، أقرّ بأني قرأت النموذج أعلاه ولست حامل، وأوافق على إجراء الفحص.'
    + '<span class="en">By signing, I confirm I have read the form above, I am not pregnant, and I consent to the exam.</span></div>'
    + '<div class="sigbox"><canvas id="sig"></canvas><button type="button" class="sigclear" onclick="clearSig()">مسح · Clear</button></div>'
    + '<div class="hint">وقّعي هنا بإصبعك · sign with your finger</div>'
    + '<button class="btn" id="save" onclick="submitSign()">حفظ الإقرار · Submit</button>'
    + '<div class="msg" id="msg"></div></div>'
  );
  initPad();
}

function row(k,v,ltr){ return '<div class="k">'+esc(k)+'</div><div class="v'+(ltr?' ltr':'')+'">'+esc(v||'—')+'</div>'; }
function opt(val,ar,en){
  return '<label class="opt'+(val==='lmp'?' sel':'')+'" id="opt-'+val+'"><input type="radio" name="reason" value="'+val+'"'
    +(val==='lmp'?' checked':'')+' onchange="pickReason(\''+val+'\')"><span>'+esc(ar)+'</span><span class="en">'+esc(en)+'</span></label>';
}
function pickReason(val){
  ['not_married','lmp','iud'].forEach(function(v){ var el=document.getElementById('opt-'+v); if(el) el.classList.toggle('sel', v===val); });
  document.getElementById('lmpwrap').classList.toggle('show', val==='lmp');
}

function initPad(){
  var c=document.getElementById('sig'); if(!c) return;
  var r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  // Guarantee a non-zero backing store even if the element isn't laid out yet —
  // a 0-size canvas makes toDataURL throw on some engines.
  var w=Math.round((r.width||c.offsetWidth||320))*dpr, h=Math.round((r.height||c.offsetHeight||200))*dpr;
  c.width=w; c.height=h;
  var ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#12227a';
  function pos(e){ var b=c.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-b.left, y:t.clientY-b.top}; }
  function start(e){ e.preventDefault(); DRAWING=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!DRAWING) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); HAS_INK=true; }
  function end(){ DRAWING=false; }
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
  document.getElementById('lmpwrap').classList.add('show');
}
function clearSig(){ var c=document.getElementById('sig'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); HAS_INK=false; } }

function submitSign(){
  var msg=document.getElementById('msg');
  if(!HAS_INK){ msg.className='msg err'; msg.textContent='الرجاء التوقيع أولاً · Please sign first'; return; }
  var reason=(document.querySelector('input[name="reason"]:checked')||{}).value||'';
  var lmp=(document.getElementById('lmp')||{}).value||'';
  if(reason==='lmp' && !lmp){ msg.className='msg err'; msg.textContent='أدخلي تاريخ آخر دورة · Enter the last menstrual period'; return; }
  var c=document.getElementById('sig');
  var sigData;
  try { sigData=c.toDataURL('image/png'); }
  catch(err){ msg.className='msg err'; msg.textContent='تعذّر قراءة التوقيع على هذا المتصفح — جرّبي متصفح آخر. ('+esc(err&&err.message||'')+')'; return; }
  if(!sigData || sigData.length<200){ msg.className='msg err'; msg.textContent='التوقيع فارغ، أعيدي المحاولة · Signature empty'; return; }
  var btn=document.getElementById('save'); btn.disabled=true; var t0=btn.textContent; btn.textContent='جارٍ الحفظ…';
  msg.textContent='';
  fetch('/api/public/consent/'+encodeURIComponent(TOKEN)+'/sign',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ signature:sigData, reason:reason, lmp_date:lmp, hcg:'' })
  }).then(function(r){
    // Show the true error even when the body isn't JSON (proxy/HTML error page).
    if(!r.ok){ return r.text().then(function(t){ var m; try{ m=JSON.parse(t).detail; }catch(e){ m=t; } throw new Error(m||('HTTP '+r.status)); }); }
    return r.json();
  }).then(function(){ doneView(); }).catch(function(e){
    btn.disabled=false; btn.textContent=t0; msg.className='msg err'; msg.textContent=esc((e&&e.message)||'تعذّر الحفظ');
  });
}

function doneView(){
  show('<div class="card done"><div class="big">✅</div><div class="t">تم الحفظ · Signed</div>'
    +'<div class="s">You may hand the device back to the specialist.</div></div>');
}

load();
</script>
</body>
</html>
