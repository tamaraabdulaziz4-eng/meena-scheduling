<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6B4EFF">
<title>إقرار عدم الحمل · Non-Pregnancy Consent</title>
<style>
  :root{
    --pri:#6B4EFF; --acc:#8358FD; --lav:#D9D4F5; --lav2:#C3BCEF;
    --ribbon:linear-gradient(135deg,#6B4EFF 0%,#8358FD 55%,#D9D4F5 130%);
    --ink:#1f1940; --mut:#7c7a99; --line:#ECE9F5; --line2:#E0DCEF;
    --bg:#f6f5fb; --card:#fff; --wash:#F0EDFF; --field:#fff;
    --shadow:0 10px 30px rgba(38,30,79,.10), 0 2px 8px rgba(38,30,79,.05);
    --ok:#0E9F6E; --err:#e25555;
  }
  @media (prefers-color-scheme:dark){ :root{
    --ink:#e9e7f5; --mut:#9b98c0; --line:#262340; --line2:#322e52;
    --bg:#0d0b1a; --card:#17152b; --wash:#1e1b3a; --field:#1b1934;
    --shadow:0 12px 32px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.32);
  } }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; padding:0 0 40px; }
  .wrap{ max-width:560px; margin:0 auto; }

  /* ── Welcoming brand hero (mirrors the app's login side panel) ── */
  .hero{ position:relative; overflow:hidden; background:var(--ribbon); color:#fff;
    padding:30px 20px 26px; text-align:center; border-radius:0 0 26px 26px; box-shadow:var(--shadow); }
  .hero .orb{ position:absolute; border-radius:50%; filter:blur(8px); opacity:.55; pointer-events:none; }
  .hero .orb.o1{ width:150px; height:150px; background:radial-gradient(circle at 30% 30%,#fff,transparent 70%);
    top:-56px; inset-inline-start:-40px; opacity:.28; }
  .hero .orb.o2{ width:120px; height:120px; background:radial-gradient(circle at 60% 60%,#D9D4F5,transparent 70%);
    bottom:-46px; inset-inline-end:-30px; opacity:.4; }
  .hero-in{ position:relative; z-index:1; }
  .hero .mark{ width:66px; height:66px; margin:0 auto 12px; background:#fff; border-radius:20px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(38,30,79,.28); }
  .hero .mark img{ width:46px; height:46px; object-fit:contain; }
  .hero .word{ font-size:26px; font-weight:800; letter-spacing:.5px; line-height:1; }
  .hero .title{ font-size:15px; font-weight:700; margin-top:8px; direction:ltr; opacity:.98; }
  .hero .sub{ font-size:12px; font-weight:500; margin-top:2px; direction:ltr; opacity:.82; }
  .hero .tag{ display:inline-block; margin-top:12px; font-size:12px; font-weight:700; direction:rtl;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); padding:6px 14px; border-radius:999px; }
  .hero .tag .en{ direction:ltr; font-weight:500; opacity:.85; font-size:11px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; margin:14px; padding:16px;
    box-shadow:var(--shadow); }
  h2{ font-size:15px; font-weight:800; margin:2px 0 10px; }
  .decl{ background:var(--wash); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-weight:700; font-size:14px; }
  .decl .en{ display:block; direction:ltr; color:var(--mut); font-weight:500; font-size:12.5px; margin-top:3px; }
  label.opt{ display:flex; align-items:center; gap:10px; padding:12px 13px; border:1.5px solid var(--line2);
    border-radius:13px; margin-top:9px; font-size:14.5px; font-weight:600; cursor:pointer; transition:border-color .12s, background .12s; }
  label.opt.sel{ border-color:var(--pri); background:var(--wash); }
  label.opt input{ width:20px; height:20px; accent-color:var(--pri); flex:0 0 auto; }
  label.opt .en{ direction:ltr; color:var(--mut); font-size:12px; font-weight:500; margin-inline-start:auto; }
  .lmp{ margin-top:9px; display:none; } .lmp.show{ display:block; }
  .lmp input, .field input{ width:100%; padding:12px; border:1.5px solid var(--line2); border-radius:12px;
    font-size:15px; font-family:inherit; background:var(--field); color:var(--ink); }
  .lmp input:focus, .field input:focus{ outline:none; border-color:var(--pri); box-shadow:0 0 0 3px rgba(107,78,255,.14); }
  .field{ margin-top:10px; } .field .lab{ font-size:12.5px; font-weight:700; color:var(--mut); margin-bottom:5px; }
  .sigbox{ position:relative; border:2px dashed var(--line2); border-radius:14px; background:var(--field); height:210px; margin-top:8px; }
  canvas#sig{ width:100%; height:100%; display:block; touch-action:none; border-radius:12px; }
  .sigclear{ position:absolute; top:8px; inset-inline-start:8px; font-size:12px; padding:6px 12px; border:1px solid var(--line2);
    background:var(--bg); color:var(--ink); border-radius:9px; font-weight:700; cursor:pointer; }
  .hint{ font-size:12px; color:var(--mut); margin-top:6px; text-align:center; }
  .btn{ width:100%; padding:15px; border:none; border-radius:14px; background:var(--ribbon); color:#fff; font-size:16px;
    font-weight:800; font-family:inherit; margin-top:10px; cursor:pointer; box-shadow:0 8px 22px rgba(107,78,255,.32); }
  .btn:active{ transform:translateY(1px); } .btn:disabled{ opacity:.6; box-shadow:none; }
  .msg{ text-align:center; margin:12px 14px; font-size:14px; font-weight:700; min-height:20px; }
  .ok{ color:var(--ok); } .err{ color:var(--err); }
  .done{ text-align:center; padding:50px 20px; }
  .done .big{ font-size:56px; } .done .t{ font-size:20px; font-weight:800; margin-top:8px; }
  .done .s{ color:var(--mut); margin-top:6px; direction:ltr; }
  .foot{ text-align:center; color:var(--mut); font-size:11px; margin-top:16px; direction:ltr; }
  .formlbl{ font-size:13px; font-weight:800; color:var(--pri); margin-bottom:8px; }
  .formimg{ width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:12px; }

  /* ── Welcome splash (mirrors the app's post-login welcome screen) ── */
  #splash{ position:fixed; inset:0; z-index:3000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:radial-gradient(ellipse at 30% 20%, #ffffff 0%, #f3f1fc 45%, #e9e5fa 100%); }
  @media (prefers-color-scheme:dark){ #splash{
    background:radial-gradient(ellipse at 30% 20%, #17152b 0%, #131127 45%, #0d0b1a 100%); } }
  #splash.done{ animation:splashOut .6s ease forwards; }
  @keyframes splashOut{ to{ opacity:0; visibility:hidden; transform:scale(1.04); } }
  .sp-orb{ position:absolute; border-radius:50%; filter:blur(1px); pointer-events:none; }
  .sp-orb.s1{ width:240px; height:240px; top:14%; inset-inline-start:12%; opacity:.30;
    background:radial-gradient(circle at 30% 30%,#b9abf7,transparent 70%); animation:spFloat 14s ease-in-out infinite; }
  .sp-orb.s2{ width:180px; height:180px; bottom:14%; inset-inline-end:14%; opacity:.28;
    background:radial-gradient(circle at 60% 60%,#8f7bef,transparent 70%); animation:spFloat 16s ease-in-out infinite reverse; }
  @keyframes spFloat{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(14px,-18px); } }
  .sp-logo{ width:96px; height:96px; background:#fff; border-radius:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 40px rgba(38,30,79,.20); position:relative; z-index:2;
    animation:spLogoIn 1s cubic-bezier(.16,1,.3,1) both, spBob 5s ease-in-out infinite 1s; }
  .sp-logo img{ width:64px; height:64px; object-fit:contain; }
  @keyframes spLogoIn{ from{ opacity:0; transform:translateY(30px) scale(.9); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes spBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .sp-greet{ margin-top:26px; font-size:26px; font-weight:800; color:var(--ink); position:relative; z-index:2;
    animation:spGreetIn 1s cubic-bezier(.16,1,.3,1) .3s both; }
  .sp-greet .nm{ color:var(--pri); }
  @keyframes spGreetIn{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
  .sp-status{ margin-top:8px; font-size:14px; color:var(--mut); direction:ltr; position:relative; z-index:2;
    animation:spGreetIn 1s cubic-bezier(.16,1,.3,1) .5s both; }
  .sp-dots{ margin-top:26px; display:flex; gap:8px; position:relative; z-index:2; }
  .sp-dots i{ width:9px; height:9px; border-radius:50%; background:var(--pri); animation:spDot 1.2s ease-in-out infinite; }
  .sp-dots i:nth-child(2){ animation-delay:.2s; } .sp-dots i:nth-child(3){ animation-delay:.4s; }
  @keyframes spDot{ 0%,100%{ transform:scale(.6); opacity:.4; } 50%{ transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<!-- Welcome splash — the first thing the patient sees when she opens the link -->
<div id="splash">
  <div class="sp-orb s1"></div><div class="sp-orb s2"></div>
  <div class="sp-logo"><img src="/meena_logo.png" alt="Meena"></div>
  <div class="sp-greet" id="sp-greet">أهلاً وسهلاً<span class="nm" id="sp-name"></span></div>
  <div class="sp-status">Welcome · جارٍ تجهيز نموذج الموافقة…</div>
  <div class="sp-dots"><i></i><i></i><i></i></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="orb o1"></div><div class="orb o2"></div>
    <div class="hero-in">
      <div class="mark"><img src="/meena_logo.png" alt="Meena"></div>
      <div class="title">Meena RIS</div>
      <div class="sub">Radiology Information System · Subsidiary of Tawuniya</div>
      <div class="tag">نموذج إقرار بعدم وجود حمل <span class="en">· Non-Pregnancy Consent</span></div>
    </div>
  </div>
  <div id="app"><div class="card" id="loading">جارٍ التحميل… · Loading…</div></div>
  <div class="foot">Meena Health · Radiology Department</div>
</div>

<script>
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var HAS_INK = false, DRAWING = false;
var SPLASH_T0 = Date.now();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function firstName(n){ n=String(n||'').trim(); return n ? n.split(/\s+/)[0] : ''; }
function hideSplash(){
  var s=document.getElementById('splash'); if(!s || s._gone) return; s._gone=true;
  s.classList.add('done'); setTimeout(function(){ s.style.display='none'; }, 620);
}
// Hold the welcome up for a graceful minimum so it never just flashes, then reveal the form.
function revealAfterSplash(){ setTimeout(hideSplash, Math.max(0, 1700-(Date.now()-SPLASH_T0))); }

function show(html){ document.getElementById('app').innerHTML = html; }

function load(){
  if(!TOKEN){ show('<div class="card err" style="text-align:center">الرابط غير صحيح · Invalid link</div>'); revealAfterSplash(); return; }
  fetch('/api/public/consent/'+encodeURIComponent(TOKEN)).then(function(r){
    if(!r.ok) return r.json().then(function(d){ throw new Error((d&&d.detail)||('HTTP '+r.status)); });
    return r.json();
  }).then(function(d){
    var nm=firstName(d.name), el=document.getElementById('sp-name');
    if(nm && el){ el.textContent=' '+nm; }
    if(d.signed){ doneView(); } else { render(d); }
    revealAfterSplash();
  }).catch(function(e){
    show('<div class="card err" style="text-align:center">'+esc(e.message||'تعذّر فتح النموذج')+'</div>');
    revealAfterSplash();
  });
}

function render(d){
  show(
    // The REAL Meena form, pre-filled with her data — she reads the actual document.
    '<div class="card"><div class="formlbl">اقرئي النموذج · Read the form</div>'
    + '<img class="formimg" src="/api/public/consent/'+encodeURIComponent(TOKEN)+'/form.png?ts='+Date.now()+'" alt="نموذج الإقرار"'
    + ' onerror="this.style.display=\'none\';var w=document.getElementById(\'formerr\');if(w)w.style.display=\'block\';">'
    + '<div id="formerr" class="msg err" style="display:none">تعذّر تحميل صورة النموذج · Could not load the form image. الرجاء إبلاغ الأخصائي.</div></div>'

    + '<div class="card">'
    + '<h2>اختاري السبب · <span style="font-weight:500;color:var(--mut)">Select the reason</span></h2>'
    + opt('not_married','لست متزوجة','Not married')
    + opt('lmp','تاريخ آخر دورة شهرية','Last menstrual period')
    + '<div class="lmp" id="lmpwrap"><input type="date" id="lmp"></div>'
    + opt('iud','مانع الحمل اللولب','IUD')
    + '</div>'

    + '<div class="card"><h2>التوقيع · <span style="font-weight:500;color:var(--mut)">Signature</span></h2>'
    + '<div class="decl" style="margin-bottom:12px;font-size:13.5px">بالتوقيع أدناه، أقرّ بأني قرأت النموذج أعلاه ولست حامل، وأوافق على إجراء الفحص.'
    + '<span class="en">By signing, I confirm I have read the form above, I am not pregnant, and I consent to the exam.</span></div>'
    + '<div class="sigbox"><canvas id="sig"></canvas><button type="button" class="sigclear" onclick="clearSig()">مسح · Clear</button></div>'
    + '<div class="hint">وقّعي هنا بإصبعك · sign with your finger</div>'
    + '<button class="btn" id="save" onclick="submitSign()">حفظ الإقرار · Submit</button>'
    + '<div class="msg" id="msg"></div></div>'
  );
  initPad();
}

function row(k,v,ltr){ return '<div class="k">'+esc(k)+'</div><div class="v'+(ltr?' ltr':'')+'">'+esc(v||'—')+'</div>'; }
function opt(val,ar,en){
  return '<label class="opt'+(val==='lmp'?' sel':'')+'" id="opt-'+val+'"><input type="radio" name="reason" value="'+val+'"'
    +(val==='lmp'?' checked':'')+' onchange="pickReason(\''+val+'\')"><span>'+esc(ar)+'</span><span class="en">'+esc(en)+'</span></label>';
}
function pickReason(val){
  ['not_married','lmp','iud'].forEach(function(v){ var el=document.getElementById('opt-'+v); if(el) el.classList.toggle('sel', v===val); });
  document.getElementById('lmpwrap').classList.toggle('show', val==='lmp');
}

function initPad(){
  var c=document.getElementById('sig'); if(!c) return;
  var r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  // Guarantee a non-zero backing store even if the element isn't laid out yet —
  // a 0-size canvas makes toDataURL throw on some engines.
  var w=Math.round((r.width||c.offsetWidth||320))*dpr, h=Math.round((r.height||c.offsetHeight||200))*dpr;
  c.width=w; c.height=h;
  var ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#12227a';
  function pos(e){ var b=c.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-b.left, y:t.clientY-b.top}; }
  function start(e){ e.preventDefault(); DRAWING=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!DRAWING) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); HAS_INK=true; }
  function end(){ DRAWING=false; }
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
  document.getElementById('lmpwrap').classList.add('show');
}
function clearSig(){ var c=document.getElementById('sig'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); HAS_INK=false; } }

function submitSign(){
  var msg=document.getElementById('msg');
  if(!HAS_INK){ msg.className='msg err'; msg.textContent='الرجاء التوقيع أولاً · Please sign first'; return; }
  var reason=(document.querySelector('input[name="reason"]:checked')||{}).value||'';
  var lmp=(document.getElementById('lmp')||{}).value||'';
  if(reason==='lmp' && !lmp){ msg.className='msg err'; msg.textContent='أدخلي تاريخ آخر دورة · Enter the last menstrual period'; return; }
  var c=document.getElementById('sig');
  var sigData;
  try { sigData=c.toDataURL('image/png'); }
  catch(err){ msg.className='msg err'; msg.textContent='تعذّر قراءة التوقيع على هذا المتصفح — جرّبي متصفح آخر. ('+esc(err&&err.message||'')+')'; return; }
  if(!sigData || sigData.length<200){ msg.className='msg err'; msg.textContent='التوقيع فارغ، أعيدي المحاولة · Signature empty'; return; }
  var btn=document.getElementById('save'); btn.disabled=true; var t0=btn.textContent; btn.textContent='جارٍ الحفظ…';
  msg.textContent='';
  fetch('/api/public/consent/'+encodeURIComponent(TOKEN)+'/sign',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ signature:sigData, reason:reason, lmp_date:lmp, hcg:'' })
  }).then(function(r){
    // Show the true error even when the body isn't JSON (proxy/HTML error page).
    if(!r.ok){ return r.text().then(function(t){ var m; try{ m=JSON.parse(t).detail; }catch(e){ m=t; } throw new Error(m||('HTTP '+r.status)); }); }
    return r.json();
  }).then(function(){ doneView(); }).catch(function(e){
    btn.disabled=false; btn.textContent=t0; msg.className='msg err'; msg.textContent=esc((e&&e.message)||'تعذّر الحفظ');
  });
}

function doneView(){
  show('<div class="card done"><div class="big">✅</div><div class="t">تم الحفظ · Signed</div>'
    +'<div class="s">You may hand the device back to the specialist.</div></div>');
}

load();
</script>
</body>
</html>
