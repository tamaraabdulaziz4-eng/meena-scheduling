<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meena Radiology — Reports / التقارير</title>
<link rel="icon" href="/meena_logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#261E4F; --accent:#6B4EFF; --accent2:#8358FD; --muted:#8585A8;
          --border:#E0DCF5; --card:#ffffff; --bg:#f4f2fc; --ok:#00A87D; --red:#E25555; }
  * { box-sizing:border-box; }
  body { font-family:'Poppins',system-ui,sans-serif; margin:0; background:var(--bg); color:var(--primary);
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  .head { display:flex; align-items:center; gap:12px; margin:8px 0 18px; }
  .head img { height:38px; background:#fff; padding:8px 12px; border-radius:14px; box-shadow:0 8px 22px rgba(107,78,255,.16); }
  .head .t { font-size:18px; font-weight:800; }
  .head .s { font-size:12px; color:var(--muted); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px 16px;
          box-shadow:0 12px 34px rgba(43,36,88,.09); margin-bottom:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; }
  .row { display:flex; gap:8px; }
  input { flex:1; width:100%; padding:12px 13px; font-size:16px; font-family:inherit; color:var(--primary);
         border:1.5px solid var(--border); border-radius:11px; background:#fff; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(107,78,255,.12); }
  .btn { padding:12px 18px; font-size:15px; font-weight:700; font-family:inherit; color:#fff; border:none;
         border-radius:12px; background:linear-gradient(135deg,var(--accent2),var(--accent)); cursor:pointer;
         box-shadow:0 8px 20px rgba(107,78,255,.32); white-space:nowrap; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn.ghost { background:#fff; color:var(--accent); border:1.5px solid var(--border); box-shadow:none; font-size:13px; padding:8px 14px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .msg { font-size:13px; padding:10px 12px; border-radius:10px; margin-top:12px; display:none; }
  .msg.err { display:block; background:rgba(226,85,85,.12); color:#c0392b; }
  .msg.info { display:block; background:rgba(107,78,255,.1); color:var(--accent); }
  .study { border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-top:10px; cursor:pointer;
           transition:.15s; background:#fff; }
  .study:hover { border-color:var(--accent); box-shadow:0 6px 16px rgba(107,78,255,.12); }
  .study .sd { font-weight:700; font-size:15px; }
  .study .sm { font-size:12px; color:var(--muted); margin-top:3px; }
  .pill { display:inline-block; font-weight:700; font-size:11px; padding:3px 10px; border-radius:999px; }
  .pill.ok { background:rgba(0,168,125,.14); color:var(--ok); }
  .pill.wait { background:rgba(133,133,168,.16); color:var(--muted); }
  pre { white-space:pre-wrap; font-family:inherit; font-size:14px; line-height:1.7; background:var(--bg);
        border:1px solid var(--border); border-radius:12px; padding:14px; margin:12px 0 0; direction:ltr; text-align:left; }
  .loading { text-align:center; color:var(--muted); padding:26px; }
  .back { font-size:13px; color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:0; margin-bottom:6px; }
  .rhead { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="/meena_logo.png" alt="Meena">
    <div><div class="t">تقارير الأشعة / Radiology Reports</div><div class="s">ابحث عن تقرير مريض برقم الملف</div></div>
  </div>

  <div class="card" id="search-card">
    <label for="file">رقم الملف / File number</label>
    <div class="row">
      <input id="file" inputmode="numeric" autocomplete="off" placeholder="e.g. 26289620"
             onkeydown="if(event.key==='Enter')lookup()">
      <button class="btn" id="go" onclick="lookup()">بحث</button>
    </div>
    <div class="hint">تظهر الفحوصات من الأحدث. اضغط على الفحص لعرض التقرير كامل. / Newest first — tap a study to read the full report.</div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="results"></div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.search).get('token') || '';
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s){ const d=String(s||'').slice(0,16).replace('T',' '); return d||'—'; }
function showMsg(t, kind){ const m=$('msg'); m.className='msg '+(kind||'err'); m.textContent=t; }

if (!TOKEN) showMsg('الرابط ناقص الرمز. اطلب رابطًا صحيحًا من قسم الأشعة. / Link is missing its access code.', 'err');

async function api(path){
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 't=' + encodeURIComponent(TOKEN));
  if (!r.ok){ let d; try{d=await r.json()}catch(e){d={}} throw new Error(d.detail || ('HTTP '+r.status)); }
  return r.json();
}

async function lookup(){
  const file = ($('file').value||'').trim();
  $('msg').className='msg';
  if (!file) return;
  if (!TOKEN){ showMsg('الرابط ناقص الرمز.', 'err'); return; }
  $('go').disabled=true;
  $('results').innerHTML = '<div class="loading">…جاري البحث</div>';
  try {
    const d = await api('/api/public/reports/lookup?file=' + encodeURIComponent(file));
    renderList(d);
  } catch(e){
    $('results').innerHTML='';
    showMsg(e.message || 'تعذّر البحث', 'err');
  } finally { $('go').disabled=false; }
}

function renderList(d){
  const studies = d.studies || [];
  if (!studies.length){
    $('results').innerHTML = '<div class="card center" style="text-align:center;color:var(--muted)">لا توجد فحوصات لهذا الملف. / No studies for this file.</div>';
    return;
  }
  const rows = studies.map((s,i) => `
    <div class="study" onclick="openReport(${s.study_id}, ${i})">
      <div class="rhead">
        <span class="sd">${esc(s.study_desc || s.modality || 'Study')}</span>
        <span class="pill ${s.reported?'ok':'wait'}">${s.reported?'التقرير جاهز':'لم يعتمد بعد'}</span>
      </div>
      <div class="sm">${esc(s.modality||'')} · ${fmtDate(s.study_date)} · ${esc(s.pat_name||'')} · #${s.study_id}</div>
      <div id="rep-${i}"></div>
    </div>`).join('');
  $('results').innerHTML = `<div class="card"><label>النتائج / Results (${studies.length})</label>${rows}</div>`;
}

async function openReport(studyId, i){
  const slot = $('rep-'+i);
  if (!slot) return;
  if (slot.dataset.open === '1'){ slot.innerHTML=''; slot.dataset.open=''; return; }
  slot.innerHTML = '<div class="loading">…جاري تحميل التقرير</div>';
  slot.dataset.open = '1';
  try {
    const r = await api('/api/public/reports/study/' + studyId);
    const txt = (r.report_text||'').trim();
    if (!txt){ slot.innerHTML = '<pre>لا يوجد نص تقرير بعد لهذا الفحص. / No report text yet.</pre>'; return; }
    slot.innerHTML = `
      <pre id="txt-${i}">${esc(txt)}</pre>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn ghost" onclick="event.stopPropagation();copyRep(${i},this)">📋 نسخ التقرير</button>
        <a class="btn ghost" style="text-decoration:none" href="/api/public/reports/study/${studyId}/pdf?t=${encodeURIComponent(TOKEN)}" target="_blank" onclick="event.stopPropagation()">📄 PDF</a>
      </div>
      <div class="sm" style="margin-top:8px">${r.reviewer?('الطبيب: '+esc(r.reviewer)+' · '):''}${r.report_date?fmtDate(r.report_date):''}</div>`;
  } catch(e){
    slot.innerHTML = '<pre>'+esc(e.message||'تعذّر تحميل التقرير')+'</pre>';
  }
}

function copyRep(i, btn){
  const el = $('txt-'+i); if(!el) return;
  const done = ()=>{ const t=btn.textContent; btn.textContent='✓ تم النسخ'; setTimeout(()=>btn.textContent=t,1400); };
  try { navigator.clipboard.writeText(el.textContent).then(done, ()=>{ const r=document.createRange();r.selectNode(el);getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy');done(); }); }
  catch(e){}
}
</script>
</body>
</html>
