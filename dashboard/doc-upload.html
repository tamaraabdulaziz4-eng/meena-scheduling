<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meena — Upload document</title>
<link rel="icon" href="/meena_logo.png" type="image/png">
<style>
  :root{ --accent:#6B4EFF; --wash:#F0EDFF; --green:#0a8f5b; --danger:#c0261a;
    --bg:#f4f2fc; --card:#fff; --ink:#1c1930; --muted:#7a7690; --border:#e7e4f0;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){ :root{ --bg:#12101c; --card:#1a1826; --ink:#eceaf6;
    --muted:#9691ad; --border:#2c2940; --wash:#241f3d; } }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
    min-height:100dvh;padding:22px 16px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);
    border-radius:18px;box-shadow:0 10px 40px rgba(28,25,48,.1);padding:22px;align-self:flex-start}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#9a7bff);
    display:grid;place-items:center;color:#fff;font-weight:800}
  h1{font-size:17px;margin:0}
  .who{background:var(--wash);border-radius:12px;padding:11px 14px;margin:4px 0 16px;font-size:14px}
  .who b{color:var(--accent)}
  label.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    border:2px dashed var(--border);border-radius:14px;padding:30px 16px;text-align:center;
    cursor:pointer;color:var(--muted);font-size:14px;background:transparent}
  label.pick:active{background:var(--wash)}
  .pick .ic{font-size:30px}
  input[type=file]{display:none}
  .preview{margin-top:14px;text-align:center}
  .preview img{max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--border)}
  .preview .pdf{padding:16px;border:1px solid var(--border);border-radius:12px;font-size:14px}
  .name{margin-top:12px;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
  .btn{margin-top:16px;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;
    font-family:inherit;background:var(--accent);color:#fff}
  .btn[disabled]{opacity:.5}
  .btn.sec{background:transparent;color:var(--accent);border:1px solid var(--border);margin-top:8px}
  .msg{margin-top:14px;font-size:14px;text-align:center}
  .ok{color:var(--green)} .err{color:var(--danger)}
  .done{text-align:center;padding:16px 0}
  .done .big{font-size:44px} .done h2{margin:8px 0 4px;font-size:18px}
  .foot{margin-top:16px;text-align:center;color:var(--muted);font-size:11.5px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card" id="root">
    <div class="brand"><div class="logo">م</div><h1>Upload a document</h1></div>
    <div id="body"><div class="msg">Loading…</div></div>
    <div class="foot">Meena Health · the document is filed to the patient's record.</div>
  </div>

<script>
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var picked = null;        // { dataUrl, mime, isImage }
  var body = document.getElementById('body');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  async function init(){
    if(!TOKEN){ body.innerHTML = '<div class="msg err">This link is missing its code. Ask for a new QR.</div>'; return; }
    try{
      var r = await fetch('/api/doc/info?t='+encodeURIComponent(TOKEN));
      if(!r.ok){ throw new Error((await r.json().catch(function(){return{};})).detail || 'This link is not valid or has expired.'); }
      var d = await r.json();
      if(d.done){ showDone(true); return; }
      render(d.patientName || 'this patient');
    }catch(e){ body.innerHTML = '<div class="msg err">'+esc(e.message||'This link is not valid.')+'</div>'; }
  }

  function render(name){
    body.innerHTML =
      '<div class="who">Uploading for <b>'+esc(name)+'</b></div>'+
      '<label class="pick" id="picklabel">'+
        '<span class="ic">📷</span><span>Take a photo or choose a file</span>'+
        '<span style="font-size:12px">Outside report · referral · lab result (JPG, PNG or PDF)</span>'+
      '</label>'+
      '<input type="file" id="file" accept="image/*,application/pdf" capture="environment">'+
      '<div class="preview" id="preview"></div>'+
      '<div id="controls"></div>'+
      '<div class="msg" id="msg"></div>';
    document.getElementById('picklabel').addEventListener('click', function(){ document.getElementById('file').click(); });
    document.getElementById('file').addEventListener('change', onPick);
  }

  function onPick(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var isImage = /^image\//.test(f.type);
    var reader = new FileReader();
    reader.onload = function(){
      picked = { dataUrl: reader.result, mime: f.type || 'application/octet-stream', isImage: isImage, name: f.name };
      var pv = document.getElementById('preview');
      pv.innerHTML = isImage ? '<img src="'+picked.dataUrl+'" alt="preview">'
        : '<div class="pdf">📄 '+esc(f.name||'Document.pdf')+'</div>';
      document.getElementById('controls').innerHTML =
        '<input class="name" id="docname" placeholder="Label (e.g. Outside CT report)" value="'+esc(labelFrom(f.name))+'">'+
        '<button class="btn" id="send">Upload to patient file</button>'+
        '<button class="btn sec" id="again">Choose a different file</button>';
      document.getElementById('send').addEventListener('click', submit);
      document.getElementById('again').addEventListener('click', function(){ document.getElementById('file').click(); });
    };
    reader.readAsDataURL(f);
  }
  function labelFrom(n){ return String(n||'').replace(/\.[a-z0-9]+$/i,'').slice(0,50); }

  async function submit(){
    if(!picked) return;
    var btn = document.getElementById('send'); btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Uploading…';
    var msg = document.getElementById('msg'); msg.className='msg'; msg.textContent='';
    try{
      var r = await fetch('/api/doc/submit', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ t: TOKEN, file: picked.dataUrl, name: (document.getElementById('docname').value||'Document') }) });
      var d = await r.json().catch(function(){return{};});
      if(!r.ok){ throw new Error(d.detail || 'Upload failed. Please try again.'); }
      showDone(d.filed);
    }catch(e){
      btn.disabled=false; btn.textContent='Upload to patient file';
      msg.className='msg err'; msg.textContent = e.message || 'Upload failed.';
    }
  }

  function showDone(filed){
    body.innerHTML = '<div class="done"><div class="big">✅</div>'+
      '<h2>Document received</h2>'+
      '<div class="msg '+(filed?'ok':'')+'">'+(filed
        ? 'It has been filed to the patient\'s record.'
        : 'Saved — it will be attached to the patient\'s record shortly.')+'</div>'+
      '<div style="color:var(--muted);font-size:13px;margin-top:8px">You can close this page.</div></div>';
  }

  init();
</script>
</body>
</html>
